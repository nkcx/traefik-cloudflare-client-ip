name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -v ./...
      # Traefik runs plugins in the Yaegi interpreter, not compiled Go: run the tests there too
      - run: go run github.com/traefik/yaegi/cmd/yaegi@latest test -v .
